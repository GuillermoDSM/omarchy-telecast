[package]
name = "omarchy-miracast"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Experimental native Wi-Fi Display source for the Omarchy shell"

[dependencies]
anyhow = "1"
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "screencast"] }
gstreamer = { version = "0.25", features = ["v1_24"] }
gstreamer-app = { version = "0.25", features = ["v1_24"] }
gstreamer-video = { version = "0.25", features = ["v1_24"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "time", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
zbus = { version = "5.13", default-features = false, features = ["tokio"] }

[profile.release]
strip = true
lto = "thin"
